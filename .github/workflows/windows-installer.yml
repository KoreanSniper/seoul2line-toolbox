name: Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: py -m pip install -r requirements.txt pyinstaller

      - name: Build portable application
        shell: pwsh
        run: |
          py -m PyInstaller `
            --noconfirm `
            --clean `
            --onedir `
            --windowed `
            --name "seoul2line Toolbox" `
            --add-data "app/assets;app/assets" `
            --collect-submodules app.tools `
            --collect-submodules app.games `
            main.py

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\seoul2line.iss'

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: seoul2line-toolbox-installer
          path: release/seoul2line-toolbox-setup.exe

      - name: Attach installer to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/seoul2line-toolbox-setup.exe
