name: Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress --yes
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
      - name: Build application, installer and update manifest
        shell: pwsh
        run: ./installer/build.ps1 -Python (Get-Command python).Source -InstallDependencies
      - uses: actions/upload-artifact@v4
        with:
          name: seoul2line-toolbox-installer
          path: |
            release/seoul2line-toolbox-setup.exe
            release/update.json
          if-no-files-found: error
      - name: Publish stable release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/seoul2line-toolbox-setup.exe
            release/update.json
